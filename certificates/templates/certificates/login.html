{% load static %}
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Login | CodeRed Invention</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#f5f5f5;font-family:Arial,sans-serif;padding:20px}
.card{width:min(100%,390px);padding:32px;border:1px solid #333;border-radius:18px;background:#1b1b1b;box-shadow:0 20px 60px #0008}
h1{margin:0 0 8px;font-size:25px}.muted{color:#aaa;margin:0 0 26px}label{display:block;margin:14px 0 7px;color:#ccc;font-size:14px}
input{width:100%;padding:13px;border-radius:9px;border:1px solid #444;background:#111;color:white;font-size:16px}
button{width:100%;padding:13px;margin-top:20px;border:0;border-radius:9px;background:#e10c1a;color:white;font-weight:700;font-size:15px;cursor:pointer}
.error{color:#ff7777;font-size:14px;margin-top:12px}
</style></head><body><main class="card"><h1>CodeRed Invention</h1><p class="muted">Certificate Admin Portal</p>
<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
<label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
{% if form.errors %}<div class="error">Invalid username or password.</div>{% endif %}
<button type="submit">Sign in</button></form></main></body></html>
